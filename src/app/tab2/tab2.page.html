<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Search</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [(ngModel)]="selectedCategory" (ionChange)="onSearch()">
      <ion-segment-button value="all">
        <ion-label>All</ion-label>
      </ion-segment-button>
      <ion-segment-button value="book">
        <ion-label>Books</ion-label>
      </ion-segment-button>
      <ion-segment-button value="movie">
        <ion-label>Movies</ion-label>
      </ion-segment-button>
      <ion-segment-button value="series">
        <ion-label>Series</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchQuery"
      (ionInput)="onSearch()"
      [debounce]="0"
      placeholder="Search books, movies, series...">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (isLoading()) {
    <div class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  }

  <ion-list>
    @for (item of results(); track item.id) {
      <ion-item>
        <ion-thumbnail slot="start">
          <img
            [src]="item.coverUrl || 'https://placehold.co/100x150?text=No+Cover'"
            [alt]="item.title" />
        </ion-thumbnail>

        <ion-label>
          <h2>{{ item.title }}</h2>
          <p>{{ item.creator }}</p>
          <ion-badge color="medium">{{ item.type }}</ion-badge>
        </ion-label>

        <ion-button
          slot="end"
          [disabled]="savedIds().has(item.id)"
          [color]="savedIds().has(item.id) ? 'success' : 'primary'"
          (click)="addItem(item)">
         {{ savedIds().has(item.id) ? 'Added' : 'Add' }}
        </ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
